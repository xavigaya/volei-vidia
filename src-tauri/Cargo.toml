[package]
name = "volei-vidia"
version = "0.10.1"
description = "Volei VidIA — estadístiques de voleibol amb vídeo"
authors = ["Volei VidIA"]
edition = "2021"

[lib]
name = "volei_vidia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
