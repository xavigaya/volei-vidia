name: Aplicacions

# Compila les aplicacions instal·lables:
#  - Windows (.msi i .exe) i Linux (.deb, .AppImage, .rpm) amb Tauri
#  - Android (.apk) amb Capacitor
# S'executa quan canvia la versió de package.json a la branca main, en
# publicar una etiqueta de versió (v0.8.0…) o manualment. Excepte en
# l'execució manual, es crea una "Release" v<versió> amb tots els fitxers.
#
# Opcional: les variables del repositori SUPABASE_URL i SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions → Variables) fan que les
# aplicacions ja vinguin connectades al servidor del club. Si no hi són,
# l'aplicació ho demana la primera vegada que s'obre.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - package.json
      - src-tauri/**
      - .github/workflows/apps.yml

# Per defecte només lectura; la feina de publicar té permís d'escriptura
permissions:
  contents: read

env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  desktop:
    name: Escriptori (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Dependències del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --no-audit --no-fund
      - name: Compila l'aplicació d'escriptori
        run: npx tauri build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: escriptori-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Projecte Android
        run: npx cap add android
      - name: Icones i pantalla d'inici
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android --assetPath assets
      - run: npx cap sync android
      - name: Compila l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nom del fitxer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "VoleiVidIA-v$(node -p "require('./package.json').version").apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          if-no-files-found: error
          path: VoleiVidIA-*.apk

  release:
    name: Publica la versió
    if: github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Versió
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: fitxers
          merge-multiple: true
      - run: ls -R fitxers
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Volei VidIA ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.tag }}
          body: |
            Aplicacions instal·lables de Volei VidIA.

            - **Windows**: `.msi` o `.exe` (instal·lador).
            - **Linux**: `.deb` (Ubuntu/Debian/Linkat), `.rpm` (Fedora) o `.AppImage` (qualsevol distribució).
            - **Android**: `.apk` (cal permetre la instal·lació d'aplicacions de fonts desconegudes).

            La primera vegada que s'obre, l'aplicació demana l'adreça i la clau del servidor Supabase del club.
          files: fitxers/**/*
